# WHITE AI V1 deployment for Render. No credentials are stored in GitHub.
# This blueprint deploys ONLY the existing experimental branch.
services:
  - type: web
    name: white-ai-v1
    runtime: python
    plan: free
    repo: https://github.com/WHITEDRAGONx/WHITE-HUB
    branch: dev/2026-10-10-autosell-compat
    autoDeployTrigger: off
    buildCommand: pip install -r ai/requirements.txt && python -m compileall -q ai && python -m unittest ai.test_server ai.test_owner_session
    startCommand: uvicorn ai.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GITHUB_TOKEN
        sync: false
      - key: WHITEAI_INGEST_KEY
        sync: false
      - key: WHITEAI_ADMIN_KEY
        sync: false
      - key: WHITEAI_SESSION_NOT_BEFORE
        value: "0"
      - key: WHITEAI_AUTOPATCH_ENABLED
        sync: false
